services:
  adm-assignment-demo:
    image: ${ADM_IMAGE}
    container_name: adm-assignment-demo
    env_file:
      - .env
    ports:
      - "${ADM_HTTP_PORT:-5050}:5050"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
