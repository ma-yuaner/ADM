services:
  adm-assignment-demo:
    build:
      context: .
    image: adm-assignment-demo:local
    container_name: adm-assignment-demo
    environment:
      ADM_DATA_MODE: ${ADM_DATA_MODE:-mock}
      ADM_WRITE_ENABLED: ${ADM_WRITE_ENABLED:-false}
      ADM_DEFAULT_PERSON: ${ADM_DEFAULT_PERSON:-黄娜娟}
      ADM_OPERATOR_ID: ${ADM_OPERATOR_ID:-0}
      ADM_DB_HOST: ${ADM_DB_HOST:-}
      ADM_DB_PORT: ${ADM_DB_PORT:-3306}
      ADM_DB_USER: ${ADM_DB_USER:-}
      ADM_DB_PASSWORD: ${ADM_DB_PASSWORD:-}
      ADM_DB_DATABASE: ${ADM_DB_DATABASE:-sibedb}
      ADM_FINANCE_DIFF_ENABLED: ${ADM_FINANCE_DIFF_ENABLED:-false}
      ADM_FINANCE_DB_HOST: ${ADM_FINANCE_DB_HOST:-}
      ADM_FINANCE_DB_PORT: ${ADM_FINANCE_DB_PORT:-3306}
      ADM_FINANCE_DB_USER: ${ADM_FINANCE_DB_USER:-}
      ADM_FINANCE_DB_PASSWORD: ${ADM_FINANCE_DB_PASSWORD:-}
      ADM_FINANCE_DB_DATABASE: ${ADM_FINANCE_DB_DATABASE:-ibf_prod_db}
      ADM_LOG_LEVEL: ${ADM_LOG_LEVEL:-INFO}
      ADM_WECOM_SEND_ENABLED: ${ADM_WECOM_SEND_ENABLED:-false}
      ADM_WECOM_WEBHOOK_URL: ${ADM_WECOM_WEBHOOK_URL:-}
      ADM_WECOM_PEOPLE_FILE: ${ADM_WECOM_PEOPLE_FILE:-config/wecom_people.json}
      ADM_WECOM_PEOPLE_JSON: '${ADM_WECOM_PEOPLE_JSON:-}'
      ADM_RECOVERY_DB_PATH: ${ADM_RECOVERY_DB_PATH:-data/adm_recovery.db}
      ADM_UPLOAD_MAX_BYTES: ${ADM_UPLOAD_MAX_BYTES:-10485760}
    ports:
      - "${ADM_HTTP_PORT:-5050}:5050"
    restart: unless-stopped
    volumes:
      - adm-recovery-data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  adm-recovery-data:
